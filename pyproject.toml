[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sat-guard"
version = "0.1.0"
description = "Spacecraft telemetry anomaly detection and monitoring"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.12",
    "scikit-learn>=1.4",
    "pyarrow>=15"
    "prometheus-client"
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6"
]

[tool.setuptools.packages.find]
where = ["src"]