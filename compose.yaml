
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: sat-guard-api:0.1.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      SAT_GUARD_MODEL_PATH: /app/artifacts/cadc0872_random_forest.joblib
    volumes:
      - ./artifacts/cadc0872_random_forest.joblib:/app/artifacts/cadc0872_random_forest.joblib:ro

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    depends_on:
      - api


  grafana:
    image: grafana/grafana:13.3.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
    depends_on:
      - prometheus


volumes:
  prometheus-data:
    external: true
    name: sat-guard-prometheus-data

  grafana-data:
    external: true
    name: sat-guard-grafana-data
